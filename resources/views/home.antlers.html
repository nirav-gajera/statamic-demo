<!-- Dynamic Antlers Template executing code_field directly from CP -->
{{ code_field:code }}

<!-- Dynamic Projects Collection -->
<section id="projects" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 border-b border-slate-200 pb-6 gap-4">
        <div>
            <h2 class="text-xs font-mono uppercase tracking-widest text-indigo-600 font-bold mb-2">Past Projects & Case Studies</h2>
            <h3 class="text-3xl font-extrabold text-slate-900 tracking-tight">Enterprise IT Portfolio Projects</h3>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        {{ collection:projects }}
            <a href="{{ url }}" class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl transition duration-300 group flex flex-col justify-between block">
                <div>
                    <div class="relative h-48 overflow-hidden bg-slate-100">
                        <img src="{{ featured_image }}" alt="{{ title }}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute top-4 left-4">
                            <span class="px-3 py-1 bg-slate-900/85 backdrop-blur-md text-white text-[11px] font-mono font-semibold rounded-full">
                                {{ category }}
                            </span>
                        </div>
                    </div>

                    <div class="p-6">
                        <div class="flex justify-between items-center text-xs text-slate-400 font-mono mb-2">
                            <span>CLIENT: <strong class="text-slate-800">{{ client_name }}</strong></span>
                            <span>YEAR: {{ year }}</span>
                        </div>
                        <h4 class="text-xl font-bold text-slate-900 mb-2 group-hover:text-indigo-600 transition">{{ title }}</h4>
                        <p class="text-slate-600 text-xs leading-relaxed line-clamp-3">
                            {{ content }}
                        </p>
                    </div>
                </div>

                <div class="px-6 pb-6 pt-2 border-t border-slate-100 flex items-center justify-between">
                    <span class="text-xs font-semibold text-indigo-600 group-hover:translate-x-1 transition duration-300 flex items-center space-x-1">
                        <span>Read IT Case Study</span>
                        <span>&rarr;</span>
                    </span>
                    <span class="text-[10px] font-mono bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-bold">Read Dedicated Page</span>
                </div>
            </a>
        {{ /collection:projects }}
    </div>
</section>
