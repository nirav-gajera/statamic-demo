portfolio_explanation_title: 'What is a Corporate Business Portfolio?'
portfolio_explanation_p1: 'A business portfolio is like a brochure or a resume for a company. It shows what a company does, what they have done before, and what makes them special. It is a way of introducing the company to others and saying: "Hey, this is what we do, and we are pretty good at it." This establishes credibility and helps the company gain new business partnerships.'
portfolio_explanation_p2: 'At Test Company (IT Industry), our portfolio highlights our software products, cloud services, past IT projects, business strategy, and technical performance metrics. Our goal is to demonstrate our competitive advantage in software architecture, cloud platforms, and enterprise solutions.'
